name: Ubuntu Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        compiler: [clang, gcc]
        include:
          - compiler: clang
            c_compiler: clang
            cxx_compiler: clang++
          - compiler: gcc
            c_compiler: gcc
            cxx_compiler: g++
    steps:
    - uses: actions/checkout@v4
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.compiler }}
        repository-cache: true
    - name: Install parser generators
      run: sudo apt-get update && sudo apt-get install -yq bison flex libfl-dev
    - name: Build
      run: bazel build //:all --repo_env=CC=${{ matrix.c_compiler }} --repo_env=CXX=${{ matrix.cxx_compiler }}
    - name: Test
      run: bazel test //:naja_verilog_tests --repo_env=CC=${{ matrix.c_compiler }} --repo_env=CXX=${{ matrix.cxx_compiler }}
